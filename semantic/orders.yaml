entity:
  name: order

  display_name: Order

  description: >
      Represents the total number of customer orders processed by the business.
      This metric helps monitor customer purchasing activity, sales trends,
      and operational performance across different regions, categories,
      and customer segments.

  source:
    table: orders

  primary_key: order_id

  attributes:
    - order_id
    - order_date
    - customer_id
    - ship_mode
    - region

  relationships:
    - belongs_to: customer
    - contains: product
    - shipped_by: ship_mode

  business_use:
    - Order tracking
    - Revenue analysis
    - Sales reporting
    - Customer purchase analysis