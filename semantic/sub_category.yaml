entity:
  name: sub_category

  display_name: Sub Category

  description: >
    Represents the subdivision of a product category.
    It helps analyze product performance at a more detailed level.

  source:
    table: orders

  primary_key: sub_category

  attributes:
    - sub_category

  relationships:
    - belongs_to: category

  business_use:
    - Product analysis
    - Sub-category sales
    - Profit analysis