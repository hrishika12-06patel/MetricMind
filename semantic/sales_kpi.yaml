kpi:
  name: Sales KPI

  description: >
    Measures the total sales generated from customer orders.

  source_metric: gross_revenue

  calculation_logic: >
    Sum of unit price multiplied by quantity for all completed orders.

  business_meaning: >
    Represents the overall revenue generated by the business.

  business_questions:
    - What are the total sales?
    - Which region has the highest sales?
    - Which category generates the most sales?